schema_version: "1.1"
name: review-react-modal-raweb
expected_outcome: |
  A review that identifies, with RAWeb 1.1 criterion and test numbers, at least: the dialog has no role="dialog" /
  aria-modal and no accessible name (7.1, test 7.1.1 or 7.1.3); the close control is a div with onClick, not focusable
  and without a name (7.3 test 7.3.1 and 7.1 test 7.1.3); the svg icon is neither aria-hidden nor named (1.2 test 1.2.4
  or 1.1 test 1.1.5); no Escape key handling and no focus management (focus not moved into the dialog on open nor
  restored on close, background not inert) (7.3, 12.8 / 12.9); focus outline removed in Modal.css (10.7 test 10.7.1);
  the modal opening automatically after 8 s is a change of context not initiated by the user (7.4 test 7.4.1, and/or
  13.1); the e-mail and message fields have only placeholders and no label (11.1 test 11.1.1); the mandatory indication
  is only in the placeholder and errors are signalled by colour alone with a generic message that does not identify the
  field (11.10 tests 11.10.1/11.10.3, 3.1); the e-mail field lacks autocomplete="email" (11.13). Each issue comes with a
  concrete fix (role="dialog" aria-modal="true" aria-labelledby, <button type="button" aria-label="Fermer">,
  aria-hidden="true" on the svg, keydown Escape handler, focus trap / initial focus / focus restore, inert on the rest
  of the page, visible focus style, remove auto-open or let the user control it, <label> elements, aria-describedby
  error messages with text, autocomplete). Output is organised so it can become tickets (one item per issue, with
  criterion, test, impact and fix).
context:
  scaffold_script: place-files.sh
